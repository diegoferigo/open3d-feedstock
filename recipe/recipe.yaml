schema_version: 1

context:
  name: Open3D
  version: "0.19.0"
  build_number: 112

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/isl-org/Open3D/archive/v${{ version }}.tar.gz
  sha256: 5cedb0e093c6baceab801b903eb8e2558bc2b3999ac57762bf78a39d5e15394a
  patches:
    - fix-unzip.patch
    - if: not win
      then: fix-curl.patch
    - fix-error.patch
    - fix-find-imgui.patch
    - if: osx
      then: fix-crypto.patch
    - if: win
      then:
        - fix-win-extractzip.patch
        - fix-win-minizip.patch
        - 7335.patch
    - 7249.patch
    - fix-requirements-txt.patch
    - fix-missing-memory-include.patch
    - fix-gcc15-missing-cstdint.patch
    - if: linux and aarch64
      then:
        - fix-filament.patch

build:
  number: ${{ build_number }}
  script:
    # Expose the sysroot glibc floor to build.sh so the installed wheel can be
    # retagged to the pinned baseline instead of a hardcoded manylinux version.
    # Empty on platforms without a glibc sysroot (osx/win), where it is unused.
    env:
      c_stdlib_version: ${{ c_stdlib_version | default('') }}
  python:
    entry_points:
      - open3d = open3d.tools.cli:main

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - cmake <4
    - make
    - pkg-config
    - git
    - if: osx or (linux and aarch64)
      then: llvm-openmp
    - if: linux
      then: libgomp
  host:
    - if: linux
      then:
        - libgl-devel
        - libglx-devel
        - libopengl-devel
        - xorg-libxdamage
        - xorg-libxfixes
        - libxcb
        - xorg-libx11
        - clangdev
        - libclang
        - libcxx
        - libcxxabi
    - setuptools
    - python
    - pip
    - assimp
    - libzlib
    - eigen
    - embree
    - glew
    - glfw
    - fmt
    - libjpeg-turbo
    - gmock
    - jsoncpp
    - zeromq
    - cppzmq
    - msgpack-c
    - msgpack-cxx
    - minizip
    - vtk
    - qt6-main
    - libpng
    - pybind11
    - pybind11-abi
    - qhull
    - libtinyobjloader
    - libvulkan-loader
    - libvulkan-headers
    - gtest
    - gmock
    - if: not win
      then:
        - qhull-static
        - libcblas
        - liblapacke
        - nomkl
      else:
        - liblapack * *mkl
        - liblapacke * *mkl
        - mkl-devel
    - libboost-headers
    - nanoflann
    - liblzf
    - libcurl
    - if: not linux
      then: openssl
    - tbb-devel
    - if: win
      then:
        - liblzma-devel
        - vcomp14
    # TODO: Consider for the future
    # - libidn2  # [osx]
    # - imgui      # TODO: Fails with error C2039: 'KeyMap': is not a member of 'ImGuiIO'
    # - tinygltf   # TODO: Does not export cmake config in conda-forge; see https://github.com/conda-forge/tinygltf-feedstock/issues/24
    # - pytorch
  run:
    - numpy
    - python
    - plotly
    - dash
    - if: win
      then:
        - libblas * *mkl
        - minizip
  run_exports:
    - ${{ pin_subpackage('open3d', upper_bound='x.x.x') }}
  ignore_run_exports:
    from_package:
      - libcblas
      - minizip
      - msgpack-c
      - msgpack-cxx

tests:
  - python:
      imports:
        - open3d
        - open3d.visualization
      pip_check: true
  - script:
      - python -c "from importlib.metadata import version; assert version('open3d'); assert version('open3d-cpu')"
  - script:
      - open3d --help

about:
  summary: Open-source library that supports rapid development of software that deals with 3D data.
  license: MIT
  license_file:
    - LICENSE
    - 3rdparty/imgui/LICENSE
    - 3rdparty/uvatlas/LICENSE_directxheaders
    - 3rdparty/uvatlas/LICENSE_directxmath
    - 3rdparty/uvatlas/LICENSE_uvatlas
    - 3rdparty/possionrecon/LICENSE
    - 3rdparty/rply/LICENSE
    - 3rdparty/tinyfiledialogs/LICENSE
    - 3rdparty/tinygltf/LICENSE
  homepage: http://www.open3d.org/
  repository: https://github.com/isl-org/Open3D

extra:
  recipe-maintainers:
    - goanpeca
    - Tobias-Fischer
    - traversaro
